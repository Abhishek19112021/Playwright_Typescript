name: Academy quality gates
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: API tests
        working-directory: api
        run: npm ci && npm test
      - name: Frontend build
        working-directory: vue-app
        run: npm ci && npm run build
      - name: Browser tests
        working-directory: automation-tests
        run: npm ci && npx playwright install --with-deps chromium && npm run playwright
