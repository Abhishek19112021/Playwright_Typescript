name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build TypeScript tests
        run: npm run build:tests
      - name: Run Playwright tests (CI)
        run: npx playwright test --reporter=list || true

      - name: Package test artifacts
        if: always()
        run: node scripts/package-artifacts.js

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      - name: Upload artifacts zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Flaky test report
        if: always()
        run: node scripts/flaky-report.js test-results/results.json || true

      - name: Optionally upload artifacts to S3
        if: ${{ secrets.S3_BUCKET }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          node scripts/package-artifacts.js
          node scripts/upload-artifacts.js artifacts
      - name: Create flaky issues
        if: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ensure-labels.js || true
          node scripts/create-flaky-issues.js test-results/results.json || true
